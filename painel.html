<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oquefazer · Painel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5F0;--surface:#FFFFFF;--surface2:#F0EDE6;
    --ink:#1A1814;--ink2:#6B6760;--ink3:#A8A49E;
    --accent:#2D5A3D;--accent-light:#E8F0EB;
    --accent2:#C4472A;--accent2-light:#FAEAE6;
    --amber:#C47D1A;--amber-light:#FAF0E0;
    --border:rgba(26,24,20,0.1);--radius:16px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;}
  
  /* Layout Base */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--surface);padding:32px;border-radius:var(--radius);width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.05);}
  h1{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:8px;}
  p{color:var(--ink2);margin-bottom:24px;line-height:1.5;}
  input{width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px;font-family:inherit;outline:none;}
  button{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  
  #dashboard{display:none;padding:20px;max-width:1200px;margin:0 auto;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;}
  
  /* 1. VISÃO GERAL E BOTÕES DE PERÍODO */
  .controls{display:flex;gap:12px;margin-bottom:24px;overflow-x:auto;padding-bottom:8px;}
  .period-btn{background:var(--surface2);padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;width:auto;}
  .period-btn.active{background:var(--accent);color:#fff;}

  /* 2. TODOS OS ANUNCIANTES NUMA LINHA (ESTILO ANDROID) */
  #ad-tabs-list {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    padding: 10px 0 20px 0;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }
  #ad-tabs-list::-webkit-scrollbar { display: none; } /* Esconde barra no mobile */

  /* Estilização dos Botões com as Imagens PNG */
  .tab-btn {
    flex: 0 0 160px; /* Largura fixa para permitir o scroll horizontal */
    scroll-snap-align: start;
    height: 80px;
    border-radius: var(--radius-sm);
    border: 2px solid transparent;
    background-color: var(--surface2);
    background-size: cover;
    background-position: center;
    color: white;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  .tab-btn.active {
    border-color: var(--accent);
    transform: scale(1.05);
  }

  /* Mapeamento de Imagens PNG nos Botões */
  .tab-btn[data-ad^="premium_"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('banner_premium_topo.png'); }
  .tab-btn[data-ad="generico_anuncie_aqui"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('banner_generico_topo.png'); }
  .tab-btn[data-ad^="mensal_"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('card_principal.png'); }
  
  /* Identificação dos Semanais */
  .tab-btn[data-ad*="_s1_esq_"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('semana_esquerda.png'); }
  .tab-btn[data-ad*="_s1_meio_"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('semana_meio.png'); }
  .tab-btn[data-ad*="_s1_dir_"] { background-image: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('semana_direita.png'); }

  /* Grid de Dados */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px;}
  .stat-card{background:var(--surface);padding:24px;border-radius:var(--radius);border:1px solid var(--border);}
  .stat-label{color:var(--ink2);font-size:13px;margin-bottom:8px;display:block;}
  .stat-value{font-family:'DM Serif Display',serif;font-size:32px;display:block;}

  @media(max-width:600px){
    .header{flex-direction:column;align-items:flex-start;gap:16px;}
    .tab-btn { flex: 0 0 140px; height: 70px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="card" id="auth-step">
    <h1>Entrar</h1>
    <p>Acesse as estatísticas do seu painel</p>
    <input type="password" id="api-key" placeholder="Chave da API">
    <button class="btn-primary" id="btn-login">Continuar</button>
  </div>
  <div class="card" id="property-step" style="display:none;">
    <h1>Propriedade</h1>
    <p>Informe o ID da propriedade do Google Analytics</p>
    <input type="text" id="property-input" placeholder="Ex: 468452345">
    <button class="btn-primary" id="btn-prop">Acessar Painel</button>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <div>
      <h1 id="ad-title">Carregando...</h1>
      <p id="ad-subtitle">Selecione um anunciante abaixo</p>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="btn-refresh" style="width:auto;background:var(--surface2);">Atualizar</button>
      <button id="btn-logout" style="width:auto;background:var(--accent2-light);color:var(--accent2);">Sair</button>
    </div>
  </div>

  <div class="controls">
    <button class="period-btn active" data-days="7">Últimos 7 dias</button>
    <button class="period-btn" data-days="30">Últimos 30 dias</button>
    <button class="period-btn" data-days="90">Últimos 90 dias</button>
  </div>

  <div id="ad-tabs-list">
    <button class="tab-btn active" data-ad="generico_anuncie_aqui">Geral</button>
    </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Visualizações (Impressões)</span>
      <span class="stat-value" id="val-views">-</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Cliques no Banner</span>
      <span class="stat-value" id="val-clicks">-</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Taxa de Cliques (CTR)</span>
      <span class="stat-value" id="val-ctr">-</span>
    </div>
  </div>
</div>

<script>
let accessToken=null;let propertyId=null;let currentDays=7;let allStats={};
const tabsContainer=document.getElementById('ad-tabs-list');

// IDs esperados conforme suas imagens
const expectedAds = [
  'premium_topo_perto_de_voce',
  'mensal_1_restaurante_exemplo',
  'semanal_s1_esq_evento_a',
  'semanal_s1_meio_evento_b',
  'semanal_s1_dir_evento_c'
];

document.getElementById('btn-login').addEventListener('click',async()=>{
  const key=document.getElementById('api-key').value;
  if(!key)return;
  try{
    const res=await fetch('https://oauth2.googleapis.com/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${key}`
    });
    const data=await res.json();
    if(data.access_token){
      accessToken=data.access_token;
      document.getElementById('auth-step').style.display='none';
      document.getElementById('property-step').style.display='block';
    }else{alert('Chave inválida');}
  }catch(e){alert('Erro na autenticação');}
});

document.getElementById('btn-prop').addEventListener('click',()=>{
  const p=document.getElementById('property-input').value;
  if(!p)return;
  propertyId=p;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  initDashboard();
});

function initDashboard(){
  // Criar botões iniciais baseados nos esperados para teste ou dinâmico
  expectedAds.forEach(id => createTab(id));
  loadAllData();
}

function createTab(id){
  if(document.querySelector(`.tab-btn[data-ad="${id}"]`)) return;
  const btn=document.createElement('button');
  btn.className='tab-btn';
  btn.dataset.ad=id;
  btn.textContent=formatAdName(id);
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    updateDisplay(id);
  });
  tabsContainer.appendChild(btn);
}

async function loadAllData(){
  const adId = document.querySelector('.tab-btn.active').dataset.ad;
  updateDisplay(adId);
  
  const report = await fetchGA4Data();
  if(!report || !report.rows) return;

  allStats = {};
  report.rows.forEach(row => {
    const id = row.dimensionValues[0].value;
    const metric = row.dimensionValues[1].value; // customEvent:tipo
    const val = parseInt(row.metricValues[0].value);
    
    if(!allStats[id]) allStats[id] = { views:0, clicks:0 };
    if(metric === 'view') allStats[id].views = val;
    if(metric === 'click') allStats[id].clicks = val;
    
    createTab(id);
  });
  updateDisplay(document.querySelector('.tab-btn.active').dataset.ad);
}

async function fetchGA4Data(){
  try{
    const res=await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${propertyId}:runReport`,{
      method:'POST',headers:{'Authorization':`Bearer ${accessToken}`,'Content-Type':'application/json'},
      body:JSON.stringify({
        dateRanges:[{startDate:`${currentDays}daysAgo`,endDate:'today'}],
        dimensions:[{name:'customEvent:ad_id'},{name:'customEvent:tipo'}],
        metrics:[{name:'eventCount'}],
        dimensionFilter:{filter:{fieldName:'eventLevelName',stringFilter:{matchType:'EXACT',value:'ad_tracking'}}}
      })
    });
    return await res.json();
  }catch(e){ return null; }
}

function updateDisplay(id){
  document.getElementById('ad-title').textContent = formatAdName(id);
  const data = allStats[id] || { views:0, clicks:0 };
  const ctr = data.views > 0 ? ((data.clicks/data.views)*100).toFixed(2) : "0.00";
  
  document.getElementById('val-views').textContent = data.views.toLocaleString();
  document.getElementById('val-clicks').textContent = data.clicks.toLocaleString();
  document.getElementById('val-ctr').textContent = ctr + '%';
}

function formatAdName(id){
  if(id==='generico_anuncie_aqui') return "Geral (Anuncie Aqui)";
  const parts = id.split('_');
  // Lógica simples de limpeza de nome para o botão
  return parts.slice(1).join(' ').toUpperCase();
}

document.querySelectorAll('.period-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentDays=parseInt(btn.dataset.days);
    loadAllData();
  });
});

document.getElementById('btn-refresh').addEventListener('click',()=>loadAllData());
document.getElementById('btn-logout').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
